<!DOCTYPE html>
<html lang="en" data-bs-theme="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>{% block title %}FinRisk{% endblock %}</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet" />
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet" />
  <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}" />
</head>
<body>

  <nav class="navbar navbar-expand bg-body-tertiary border-bottom">
    <div class="container">
      <a class="navbar-brand fw-bold text-primary d-flex align-items-center gap-2" href="/">
        <i class="bi bi-shield-check"></i> FinRisk
      </a>
      <div class="navbar-nav">
        <a class="nav-link" href="/"><i class="bi bi-search me-1"></i>Search</a>
        <a class="nav-link" href="/compare"><i class="bi bi-bar-chart-steps me-1"></i>Compare</a>
        <a class="nav-link" href="/watchlist"><i class="bi bi-star me-1"></i>Watchlist</a>
      </div>
      <div class="navbar-nav ms-auto">
        {% if current_user %}
        <span class="nav-link text-secondary">{{ current_user.username }}</span>
        <form method="POST" action="/logout" class="d-inline">
          <button type="submit" class="btn btn-sm btn-outline-light">Log out</button>
        </form>
        {% else %}
        <a class="nav-link" href="/login">Log in</a>
        <a class="nav-link" href="/signup">Sign up</a>
        {% endif %}
      </div>
    </div>
  </nav>

  {% block content %}{% endblock %}

  <footer class="text-center py-3 text-body-secondary">
    <small>For research use only. Not indicative of the financial state of a company.</small>
  </footer>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
  {% block scripts %}{% endblock %}
</body>
</html>
